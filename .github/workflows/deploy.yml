name: Build and deploy to GitHub Pages

# Vite build → dist/ → GitHub Pages. Runs on every push to main and can also be
# fired manually from the Actions tab.
#
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (not "Deploy from a branch"). This workflow does the rest.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standard permission bundle for actions/deploy-pages@v4.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one production deploy at a time; cancelling a superseded run is fine.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      # VITE_BASE_PATH must match the repo name so Vite prefixes every asset
      # URL (JS, CSS, SW manifest) with `/CSA-Evaluation-LO/`. Missing this is
      # what breaks the login on the served site.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /CSA-Evaluation-LO/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
